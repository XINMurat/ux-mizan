name: CI

# Runs the LLM-free U1-U9 registry validator over every registry in the
# repo, and self-tests that each load-bearing rule still fires. A rule
# nobody exercises is a rule that quietly stopped working: the four rules
# this skill claims are structural are exactly the ones a refactor could
# turn into no-ops without any test noticing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-registries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # U4 diffs a registry against its baseline commit; a shallow
          # clone has no such commit to reach.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r skill/ux-mizan/scripts/requirements.txt

      - name: Resolve the U4 append-only baseline
        id: baseline
        run: |
          set -e
          # Echoed deliberately: the validator degrades gracefully when a
          # baseline cannot be read, and a skipped check that prints
          # nothing is indistinguishable from a passing one.
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "U4 baseline: $base ($(git rev-parse --short "$base"))"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "::warning::No baseline commit reachable — U4 (append-only) did NOT run."
          fi

      - name: Validate every registry (U1-U11, U4 against the baseline)
        run: |
          set -e
          base="${{ steps.baseline.outputs.base }}"
          found=0
          while IFS= read -r f; do
            found=1
            rel="${f#./}"
            # --strict only for the worked examples, whose job is to MODEL
            # a finished registry. The skeletons under skill/ and templates/
            # legitimately warn (no baseline yet, no owner yet) because they
            # are blank forms; blocking on that would force fake numbers into
            # a template, which is the opposite of the honesty-annex rule.
            # And elsewhere a warning the maintainer has not acted on should
            # not block an unrelated PR — a warning that blocks is just a
            # rule with a softer name.
            strict=""
            case "$rel" in
              examples/*) strict="--strict" ;;
            esac
            echo "::group::$rel ${strict:-(advisory)}"
            if [ -n "$base" ]; then
              python skill/ux-mizan/scripts/ux_validate.py $strict --against "$base" "$rel"
            else
              python skill/ux-mizan/scripts/ux_validate.py $strict "$rel"
            fi
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -name '*ux-registry*.y*ml' -print)
          if [ "$found" -eq 0 ]; then
            echo "No registry files found to validate." >&2
            exit 1
          fi

      - name: Self-test — U1 must reject a [K] the model gave itself
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.1"}
          flows:
            - flow_id: "F-001"
              app_type: "navigational-multiscreen"
              priority_weight: 1.0
              frequency: 1.0
              applicable_metrics: [lostness]
              baseline: {values: {lostness: 0.4}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "K"
              refutation_condition: "L < 0.3 refutes"
              metric: {name: lostness, kind: behavioural, instrument: "telemetry"}
              min_n: {n: 40, decision_rule: "40 sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U1: finding UX-001 is at \[K\] with no evidence_artifact_id" \
            || { echo "FAIL: U1 did not fire on a [K] with no artifact" >&2; exit 1; }
          echo "$out" | grep -q "U1: finding UX-001 is at \[K\] with source_provenance" \
            || { echo "FAIL: U1 did not fire on model-side provenance" >&2; exit 1; }
          echo "OK: U1 holds the [K] promotion."

      - name: Self-test — U2/U3/U6 must fire on the shapes they exist for
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.1"}
          flows:
            - flow_id: "F-001"
              app_type: "single-canvas-tool"
              priority_weight: 0.5
              frequency: 2.0
              applicable_metrics: [lostness, task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              finding_type: "component-contributing"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              refutation_condition: "x"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              failure_magnitude: 0.5
              severity: 9.9
              status: "open"
              owner: "fe"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          # U6: a single-canvas tool does not switch lostness on
          echo "$out" | grep -q "U6:" || { echo "FAIL: U6 did not gate the metric matrix" >&2; exit 1; }
          # U2: a component finding with no flow to hang off
          echo "$out" | grep -q "U2:" || { echo "FAIL: U2 did not enforce flow primacy" >&2; exit 1; }
          echo "OK: U2 and U6 fired."

      - name: Self-test — U3 must recompute severity and reject the mismatch
        run: |
          set -e
          # 0.5 x 0.5 x 2.0 = 0.5, not 9.9. This is the rule that stops the
          # model re-ranking the backlog by writing a bigger number.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.1"}
          flows:
            - flow_id: "F-001"
              app_type: "single-canvas-tool"
              priority_weight: 0.5
              frequency: 2.0
              applicable_metrics: [task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 9.9
              status: "open"
              owner: "fe"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U3: finding UX-001 severity" \
            || { echo "FAIL: U3 accepted a severity that does not match the formula" >&2; exit 1; }
          echo "OK: U3 recomputed severity and rejected the mismatch."

      - name: Self-test — U4 must catch a deleted finding and a resurrected [R]
        run: |
          set -e
          reg="examples/ux-registry.example.yaml"
          cp "$reg" /tmp/reg.bak
          python - <<'PY'
          import re
          p = "examples/ux-registry.example.yaml"
          s = open(p, encoding="utf-8").read()
          # drop the refuted finding entirely — exactly what "for cleanliness" looks like
          s = re.sub(r'(?ms)^  - finding_id: "UX-004".*?(?=^evidence_artifacts:)', "", s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          out="$(python skill/ux-mizan/scripts/ux_validate.py --against HEAD "$reg" || true)"
          cp /tmp/reg.bak "$reg"
          echo "$out"
          echo "$out" | grep -q "U4:" || { echo "FAIL: U4 did not fire on a deleted [R] finding" >&2; exit 1; }
          echo "OK: U4 caught the deletion."

      - name: Self-test — the warning channel warns without blocking
        run: |
          set -e
          # A warning that blocks is a rule; a rule that cannot block is
          # decoration. The channel has to be genuinely two-valued.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.1"}
          flows:
            - flow_id: "F-001"
              app_type: "navigational-multiscreen"
              priority_weight: 1.0
              frequency: 1.0
              applicable_metrics: [task_success]
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "component-contributing"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp")"   # must exit 0
          echo "$out"
          echo "$out" | grep -q "W3:" || { echo "FAIL: W3 did not warn about the missing baseline" >&2; exit 1; }
          echo "$out" | grep -q "W4:" || { echo "FAIL: W4 did not warn about the ownerless finding" >&2; exit 1; }
          if strict_out="$(python skill/ux-mizan/scripts/ux_validate.py --strict "$tmp")"; then
            echo "FAIL: --strict did not promote warnings to failures" >&2
            exit 1
          fi
          echo "$strict_out"
          # Same finding both times, by name. A non-zero exit alone would let
          # --strict "pass" this step while failing on some unrelated rule,
          # which would prove nothing about the promotion path.
          echo "$strict_out" | grep -q "W3:" || { echo "FAIL: --strict failed, but W3 is not what it promoted" >&2; exit 1; }
          echo "$strict_out" | grep -q "W4:" || { echo "FAIL: --strict failed, but W4 is not what it promoted" >&2; exit 1; }
          echo "OK: warnings warn by default and fail under --strict, on W3 and W4 both times."

      - name: Self-test — U10 must reject a fix that skipped the self-check
        run: |
          set -e
          # Risk #1 is the one this skill can spread rather than merely
          # miss, so the check that guards it has to be exercised.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.3"}
          flows:
            - flow_id: "F-001"
              app_type: "navigational-multiscreen"
              priority_weight: 1.0
              frequency: 1.0
              applicable_metrics: [task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
              owner: "fe"
              fix: "redesign the navigation"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U10:" || { echo "FAIL: U10 did not fire on an unanswered fix" >&2; exit 1; }
          echo "OK: U10 holds a redesign to its own self-check."

      - name: Self-test — U11 must reject a [KKE] that names no missing control
        run: |
          set -e
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.4"}
          flows:
            - flow_id: "F-001"
              app_type: "navigational-multiscreen"
              priority_weight: 1.0
              frequency: 1.0
              applicable_metrics: [task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "KKE"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
              owner: "fe"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U11: finding UX-001 is at \[KKE\] with no kke_kind"             || { echo "FAIL: U11 did not fire on a KKE with no kke_kind" >&2; exit 1; }
          echo "OK: U11 requires the missing control to be named."

      - name: Self-test — a kke_kind must not outlive the tier it explains
        run: |
          set -e
          # The half the external review did not propose, and the half more
          # likely to rot: a field left behind on an entry that was promoted
          # or refuted still reads as an unmet control.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.4"}
          flows:
            - flow_id: "F-001"
              app_type: "navigational-multiscreen"
              priority_weight: 1.0
              frequency: 1.0
              applicable_metrics: [task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              kke_kind: "data"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
              owner: "fe"
          YAML
          out="$(python skill/ux-mizan/scripts/ux_validate.py "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U11: finding UX-001 carries kke_kind"             || { echo "FAIL: U11 allowed a stale kke_kind on a non-KKE entry" >&2; exit 1; }
          echo "OK: U11 holds both directions."

      - name: Self-test — U12 must force a decision on a finding that stopped moving
        run: |
          set -e
          # W4 has warned since schema 0.1 that an unowned open finding "will
          # age into a permanent [H]". It was right and it changed nothing: a
          # warning that never comes due is a note. U12 is the same observation
          # with a date attached. --as-of pins the date so this test does not
          # depend on when CI happens to run.
          tmp="$(mktemp --suffix=.yaml)"
          cat > "$tmp" <<'YAML'
          registry: {project: P, schema_version: "0.5"}
          flows:
            - flow_id: "F-001"
              app_type: "single-canvas-tool"
              priority_weight: 0.5
              frequency: 2.0
              applicable_metrics: [task_success]
              baseline: {values: {task_success: 0.5}}
              gate_provenance: {version: 1, gate_0: {locked_by: "human"}}
          findings:
            - finding_id: "UX-001"
              parent_flow_id: "F-001"
              finding_type: "flow-level"
              location: "src/a.tsx:1"
              mechanism: "a causal chain"
              tier: "H"
              refutation_condition: "x refutes"
              metric: {name: task_success, kind: behavioural, instrument: "sessions"}
              source_provenance: "walkthrough"
              gate_provenance_version: 1
              failure_magnitude: 0.5
              severity: 0.5
              status: "open"
              owner: "fe"
          YAML

          out="$(python skill/ux-mizan/scripts/ux_validate.py --as-of 2026-08-24 "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U12: finding UX-001 is open with no review_by" || { echo "FAIL: U12 did not require a review_by on an open finding" >&2; exit 1; }

          sed -i 's|    status: "open"|    status: "open"\n    review_by: "2026-03-01"|' "$tmp"
          out="$(python skill/ux-mizan/scripts/ux_validate.py --as-of 2026-08-24 "$tmp" || true)"
          echo "$out"
          echo "$out" | grep -q "U12: finding UX-001 passed its review_by" || { echo "FAIL: a passed deadline with no decision did not fire U12" >&2; exit 1; }
          echo "OK: U12 fires on a missing deadline and on a passed one."

          # Each of the three ways out clears it.
          for way in extend park close; do
            cp "$tmp" "$tmp.try"
            case "$way" in
              extend) sed -i 's|review_by: "2026-03-01"|review_by: "2099-01-01"|' "$tmp.try" ;;
              park)   sed -i 's|status: "open"|status: "parked"|' "$tmp.try" ;;
              close)  sed -i 's|status: "open"|status: "confirmed"|' "$tmp.try" ;;
            esac
            out="$(python skill/ux-mizan/scripts/ux_validate.py --as-of 2026-08-24 "$tmp.try" || true)"
            if echo "$out" | grep -q "U12:"; then
              echo "FAIL: U12 still fires after: $way" >&2; echo "$out" >&2; exit 1
            fi
          done
          echo "OK: extend, park and close each clear U12 — silence is the only thing that does not."

          # The gate: a registry written before the field existed is untouched.
          sed -i 's|schema_version: "0.5"|schema_version: "0.4"|' "$tmp"
          out="$(python skill/ux-mizan/scripts/ux_validate.py --as-of 2026-08-24 "$tmp" || true)"
          if echo "$out" | grep -q "U12:"; then
            echo "FAIL: U12 fired on a 0.4 registry; the migration gate is not holding" >&2; exit 1
          fi
          echo "OK: U12 waits for schema 0.5, the way U1-U9 waited for 0.1."

      - name: Self-test — lostness stays undefined where it is undefined
        run: |
          set -e
          python - <<'PY'
          import sys
          sys.path.insert(0, "skill/ux-mizan/scripts")
          from lostness import lostness
          # A session that visited fewer distinct screens than the canonical
          # path never had a completion to be lost on the way to. The formula
          # still returns a number there; that number is not lostness.
          assert lostness(3, 3, 4) is None, "R > N must be undefined, not a number"
          assert lostness(4, 3, 2) is None, "N > S is impossible input"
          value = lostness(4, 5, 4)
          assert 0 <= value <= 1, f"in-range inputs must stay in 0-1, got {value}"
          print(f"OK: L={value:.3f} in range; degenerate inputs return None.")
          PY

  product-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate the product registry with MIZAN's validator
        run: |
          set -e
          # The skill's own design hypotheses are a Mizan registry, not a
          # ux-mizan one -- they have thresholds and arbiters, not flows.
          # So the sibling's validator judges them. A network failure must
          # not redden this build: an unavailable dependency is not a
          # violation, and a check that cannot run says so out loud rather
          # than passing silently.
          url="https://raw.githubusercontent.com/XINMurat/Mizan/main/tools/mizan_validate.py"
          if curl -fsSL "$url" -o /tmp/mizan_validate.py; then
            python /tmp/mizan_validate.py --strict ux-mizan-product-registry.yaml
          else
            echo "::warning::Could not fetch Mizan's validator — the product registry was NOT checked."
          fi

      - name: The declared schema version agrees with the schema itself
        run: |
          set -e
          # reimagine-it keeps five host manifests honest by refusing to build
          # when they disagree on a version. Same idea, one repo: the version
          # is stated once in the schema's own banner, echoed in SKILL.md
          # frontmatter, and CI refuses to let the two drift. A version that
          # lives in two places is a version that is wrong in one of them.
          python - <<'PY'
          import io, re, sys, yaml
          schema = io.open("skill/ux-mizan/schemas/ux-registry.yaml", encoding="utf-8").read()
          banner = re.search(r"Schema v([0-9]+\.[0-9]+)", schema)
          if not banner:
              print("FAIL: the schema has no 'Schema vX.Y' banner to be pinned to", file=sys.stderr)
              sys.exit(1)
          skill = io.open("skill/ux-mizan/SKILL.md", encoding="utf-8").read()
          fm = yaml.safe_load(skill[4:skill.index(chr(10) + "---" + chr(10), 4)])
          declared = str((fm.get("metadata") or {}).get("schema_version") or "")
          if declared != banner.group(1):
              print(f"FAIL: SKILL.md declares schema_version {declared!r} but the schema banner says {banner.group(1)!r}", file=sys.stderr)
              sys.exit(1)
          print(f"ok  schema v{declared} agrees in both places")
          PY

      - name: The blank form carries none of the worked example's content
        run: |
          set -e
          # An equality check (templates/ vs schemas/) catches drift. It cannot
          # catch the opposite leak: someone edits the blank form while looking
          # at the filled one and the shipped template goes out carrying a real
          # project's names. That failure is silent -- the template still parses,
          # still validates, and quietly hands the next user someone else's data.
          #
          # Borrowed from Kayforkind/reimagine-it, whose CI asserts that one
          # example pack contains none of another's motifs. Same shape, this
          # repo's axis: proper nouns travel, blank forms must not.
          #
          # Currently clean -- this is a guard, not a repair.
          python - <<'PY'
          import io, re, sys
          tpl = io.open("templates/ux-registry.yaml", encoding="utf-8").read()
          ex = io.open("examples/ux-registry.example.yaml", encoding="utf-8").read()

          # Distinctive names from the worked example: the project/product it
          # audits, plus any capitalised multi-word proper noun it introduces.
          names = set()
          for pat in (r'project: *"?([^"\n]{3,40})', r'product: *"?([^"\n]{3,40})'):
              names |= {m.strip().strip('"') for m in re.findall(pat, ex)}
          names = {n for n in names if len(n) > 3 and not n.startswith("<")}
          if not names:
              print("no project/product name in the worked example to check against")
              sys.exit(0)

          leaked = sorted(n for n in names if n in tpl)
          if leaked:
              print("FAIL: the blank form carries the worked example's names:", file=sys.stderr)
              for n in leaked:
                  print(f"  - {n!r} appears in templates/ux-registry.yaml", file=sys.stderr)
              print("A template is a form, not a copy of somebody's filled-in registry.", file=sys.stderr)
              sys.exit(1)
          print(f"ok  blank form carries none of {sorted(names)}")
          PY

      - name: Docs claim the rule range the validator actually has
        run: |
          set -e
          # Docs go stale silently. U12 shipped and five doc files still
          # advertised the old range; nothing failed, because a range in prose
          # is not connected to anything. This connects it: the validator is
          # the source of truth, and any file claiming "U1-N" must
          # name the N the validator actually implements.
          #
          # Version-history lines are exempt by design -- "0.1 - initial
          # format; rules U1-U9" is a true statement about
          # the past, and rewriting history to match the present is the
          # opposite of what an append-only family should do.
          python - <<'PY'
          import io, os, re, sys, glob
          src = io.open("skill/ux-mizan/scripts/ux_validate.py", encoding="utf-8").read()
          have = sorted({int(n) for n in re.findall(r'"U([0-9]+)[:_]', src)})
          if not have:
              print("FAIL: no U-rules found in the validator", file=sys.stderr)
              sys.exit(1)
          top = max(have)
          print(f"validator implements U1-U{top}")

          bad = []
          for path in [p for p in (glob.glob("docs/**/*.md", recursive=True) + ["README.md", "skill/ux-mizan/SKILL.md", "CONTRIBUTING.md"] + glob.glob("tools/**/*", recursive=True) + glob.glob("skill/**/references/*.md", recursive=True)) if os.path.isfile(p) and "__pycache__" not in p and not p.endswith((".pyc", ".xlsx", ".skill"))]:
              # A changelog entry wraps across lines, so the exemption has to
              # follow the paragraph, not the line: "**v1.0** - ... G1-G6 ..."
              # is true about v1.0 no matter which line the range lands on.
              dated = False
              for i, line in enumerate(io.open(path, encoding="utf-8", errors="replace").read().splitlines(), 1):
                  if not line.strip():
                      dated = False
                  elif re.search(r"\*\*v[0-9]+\.[0-9]+\*\*", line):
                      dated = True
                  if dated:
                      continue
                  # A line that dates itself is a statement about the past --
                  # a changelog entry, a schema version-history line, a dated
                  # revision note. Rewriting those to match the present is the
                  # falsification an append-only family refuses.
                  if (re.match(r"\s*#?\s*[0-9]+\.[0-9]+\s+[-\u2014]", line)
                          or re.search(r"\*\*v[0-9]+\.[0-9]+\*\*", line)
                          or re.search(r"Revised\s+[0-9]{4}-[0-9]{2}-[0-9]{2}", line)):
                      continue
                  for claimed in re.findall(r"U1\s*[\u2013-]\s*U([0-9]+)", line):
                      if int(claimed) != top:
                          bad.append(f"{path}:{i} claims U1-U{claimed}, validator has U1-U{top}")
          if bad:
              print("FAIL: docs advertise a rule range the validator does not have:", file=sys.stderr)
              for b in bad:
                  print("  -", b, file=sys.stderr)
              sys.exit(1)
          print(f"ok  every rule-range claim says U1-U{top}")
          PY

      - name: No real name reaches what gets published
        env:
          # Set this repository secret to a newline-separated list of names that
          # must never be published: clients, internal products, private repos.
          # Unset, the sweep reports NOT CONFIGURED and passes -- a repository
          # that has not set this up is not a repository that failed.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          set -e
          # From vaddermail/maestro-framework, check 14. The examples here use
          # invented names on purpose; that is the discipline, this is the net.
          # A real name in a tracked file is published the moment it is pushed,
          # and deleting it afterwards does not un-publish it.
          #
          # The tree and the package are swept separately: they are built by
          # different code, so a clean tree does not prove a clean ux-mizan.skill.
          # A hit prints the file, the line and the term's index -- never the
          # term, because this log is public.
          python tools/leak_check.py --package ux-mizan.skill

  skill-package-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ux-mizan.skill must match skill/ux-mizan/
        run: python tools/build_skill.py --check

  skill-scan:
    # A skill is code plus instructions that load into an agent's context and
    # run with the user's permissions, so this repo ships an attack surface,
    # not just a document. This job scans skill/ux-mizan with skillvet
    # (github.com/V3r7ig0/skillvet) and fails on any high/critical finding.
    #
    # skillvet is pinned to a commit, not a branch: an unpinned security
    # scanner is itself a supply-chain hole, and a rule set that changes
    # under us turns a green run into a claim we cannot reproduce. Bumping
    # the pin is a deliberate commit, and the diff in findings is the point
    # of the bump.
    #
    # Only skills/skillvet is checked out. The upstream repo also carries 44
    # deliberately malicious benchmark fixtures; they are inert test data,
    # but there is no reason to put them on a runner, and endpoint AV
    # heuristics flag them on sight.
    #
    # The baseline suppresses one reviewed false positive: skillvet reads
    # "measures being lost without asking the user" in SKILL.md as an
    # instruction to act covertly. Its fingerprint is rule+file+snippet, so
    # if that sentence is ever reworded the suppression lapses and the
    # finding comes back for a fresh look — which is the behaviour we want.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the pinned scanner (scanner only, no benchmark corpus)
        run: |
          set -e
          git clone --quiet --filter=blob:none --no-checkout https://github.com/V3r7ig0/skillvet.git /tmp/skillvet
          git -C /tmp/skillvet sparse-checkout set --no-cone skills/skillvet
          git -C /tmp/skillvet checkout --quiet 7db0c4d30abe05ed2d6f3544e262da5d79af25b5
          echo "skillvet pinned at $(git -C /tmp/skillvet rev-parse --short HEAD)"

      - name: Scan skill/ux-mizan
        env:
          # The scanner prints a U+2192 in its verdict line; without this it
          # dies on any runner whose stdout is not UTF-8.
          PYTHONIOENCODING: utf-8
        run: |
          set -e
          python /tmp/skillvet/skills/skillvet/scripts/scan_skill.py skill/ux-mizan --fail-on high --baseline .github/skillvet-baseline.json
